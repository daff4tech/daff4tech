<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="D4Tech Hub — 22 perangkat kreator, AI dan siber">
  <title>D4Tech Hub — 22 perangkat kreator, AI &amp; siber</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1016"/>
      <stop offset="0.55" stop-color="#090c11"/>
      <stop offset="1" stop-color="#0b0f14"/>
    </linearGradient>

    <linearGradient id="wordGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#e8fff2"/>
      <stop offset="0.72" stop-color="#a6f4c5"/>
      <stop offset="1" stop-color="#34e08d"/>
      <animate attributeName="x1" values="-0.6;0.2;-0.6" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0.4;1.2;0.4" dur="9s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="arcGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12b76a" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#34e08d" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#a6f4c5" stop-opacity="0.2"/>
    </linearGradient>

    <radialGradient id="glowEmerald" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#12b76a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#12b76a" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowCrimson" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ce3f55" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ce3f55" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="coreGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#34e08d" stop-opacity="0.5"/>
      <stop offset="0.65" stop-color="#12b76a" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#12b76a" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>

    <radialGradient id="gridFade" cx="0.5" cy="0.4" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <mask id="gridMask">
      <rect width="1200" height="340" fill="url(#gridFade)"/>
    </mask>

    <clipPath id="frame">
      <rect width="1200" height="340" rx="26"/>
    </clipPath>

    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="46"/>
    </filter>

    <filter id="ringGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)" mask="url(#gridMask)"/>

    <!-- ambient glows -->
    <circle cx="150" cy="-40" r="250" fill="url(#glowEmerald)" filter="url(#soft)"/>
    <circle cx="1060" cy="360" r="230" fill="url(#glowCrimson)" filter="url(#soft)"/>

    <!-- ============================ LEFT : copy ============================ -->
    <g font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
      <g transform="translate(64 84)">
        <circle cx="4" cy="-4" r="4" fill="#34e08d"/>
        <circle cx="4" cy="-4" r="4" fill="none" stroke="#34e08d" stroke-opacity="0.5">
          <animate attributeName="r" values="4;10;4" dur="3.2s" repeatCount="indefinite"/>
          <animate attributeName="stroke-opacity" values="0.55;0;0.55" dur="3.2s" repeatCount="indefinite"/>
        </circle>
        <text x="18" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" letter-spacing="3.1" fill="#34e08d">SUPER-APP · PWA · 22 MODUL</text>
      </g>

      <text x="60" y="180" font-size="72" font-weight="800" letter-spacing="-2.6" fill="url(#wordGrad)">D4Tech Hub</text>

      <text x="64" y="222" font-size="19.5" fill="#aeb8c6">22 perangkat kreator, AI &amp; siber — satu hub tanpa registrasi.</text>

      <!-- pills -->
      <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" letter-spacing="0.6">
        <g>
          <rect x="64" y="246" width="152" height="28" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
          <text x="79" y="265" fill="#c7d0dc">node.js + express</text>
        </g>
        <g>
          <rect x="226" y="246" width="150" height="28" rx="8" fill="#12b76a" fill-opacity="0.1" stroke="#12b76a" stroke-opacity="0.34"/>
          <text x="241" y="265" fill="#a6f4c5">multi-gpu failover</text>
        </g>
        <g>
          <rect x="386" y="246" width="138" height="28" rx="8" fill="#ce3f55" fill-opacity="0.12" stroke="#ce3f55" stroke-opacity="0.34"/>
          <text x="401" y="265" fill="#ffc2cb">tanpa registrasi</text>
        </g>
      </g>

      <text x="64" y="308" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="0.4" fill="#5b6675">github.com/daff4tech/daff4tech</text>
      <text x="330" y="308" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="0.4" fill="#3d4753">·</text>
      <text x="348" y="308" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="0.4" fill="#5b6675">v4.3.0</text>
    </g>

    <!-- ============================ RIGHT : hub ============================ -->
    <g transform="translate(990 170)">
      <circle r="150" fill="url(#coreGlow)" opacity="0.55"/>

      <!-- static rings -->
      <circle r="118" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
      <circle r="88" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" stroke-dasharray="2 7"/>
      <circle r="58" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>

      <!-- rotating arcs -->
      <g filter="url(#ringGlow)">
        <circle r="118" fill="none" stroke="url(#arcGrad)" stroke-width="2.4" stroke-linecap="round"
                stroke-dasharray="150 590" stroke-dashoffset="0">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="16s" repeatCount="indefinite"/>
        </circle>
        <circle r="88" fill="none" stroke="#34e08d" stroke-opacity="0.45" stroke-width="1.6" stroke-linecap="round"
                stroke-dasharray="46 507">
          <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="11s" repeatCount="indefinite"/>
        </circle>
      </g>

      <!-- orbiting node -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/>
        <circle cx="0" cy="-118" r="3.4" fill="#a6f4c5"/>
        <circle cx="0" cy="-118" r="9" fill="#34e08d" opacity="0.18"/>
      </g>

      <!-- core -->
      <g>
        <circle r="42" fill="#0a0f14" stroke="#12b76a" stroke-opacity="0.75" stroke-width="1.4"/>
        <circle r="42" fill="none" stroke="#34e08d" stroke-opacity="0.5">
          <animate attributeName="r" values="42;62;42" dur="4.4s" repeatCount="indefinite"/>
          <animate attributeName="stroke-opacity" values="0.45;0;0.45" dur="4.4s" repeatCount="indefinite"/>
        </circle>
        <text x="0" y="9" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
              font-size="27" font-weight="800" letter-spacing="-0.6" fill="#f3f5f8">D4</text>
      </g>

      <!-- chips -->
      <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="0.4">
        <g>
          <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="7s" repeatCount="indefinite"/>
          <rect x="-32" y="-131" width="64" height="26" rx="13" fill="#0b1015" stroke="#ffffff" stroke-opacity="0.14"/>
          <text x="0" y="-114" text-anchor="middle" fill="#c7d0dc">MP3</text>
        </g>
        <g>
          <animateTransform attributeName="transform" type="translate" values="0 0;0 5;0 0" dur="6.2s" begin="-1s" repeatCount="indefinite"/>
          <rect x="70" y="-65" width="64" height="26" rx="13" fill="#0b1015" stroke="#ffffff" stroke-opacity="0.14"/>
          <text x="102" y="-48" text-anchor="middle" fill="#c7d0dc">TTS</text>
        </g>
        <g>
          <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="7.8s" begin="-2.4s" repeatCount="indefinite"/>
          <rect x="70" y="39" width="64" height="26" rx="13" fill="#0b1015" stroke="#ffffff" stroke-opacity="0.14"/>
          <text x="102" y="56" text-anchor="middle" fill="#c7d0dc">PDF</text>
        </g>
        <g>
          <animateTransform attributeName="transform" type="translate" values="0 0;0 5;0 0" dur="6.6s" begin="-3.6s" repeatCount="indefinite"/>
          <rect x="-32" y="105" width="64" height="26" rx="13" fill="#0b1015" stroke="#ffffff" stroke-opacity="0.14"/>
          <text x="0" y="122" text-anchor="middle" fill="#c7d0dc">8D</text>
        </g>
        <g>
          <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="7.2s" begin="-4.4s" repeatCount="indefinite"/>
          <rect x="-134" y="39" width="64" height="26" rx="13" fill="#0b1015" stroke="#ffffff" stroke-opacity="0.14"/>
          <text x="-102" y="56" text-anchor="middle" fill="#c7d0dc">QR</text>
        </g>
        <g>
          <animateTransform attributeName="transform" type="translate" values="0 0;0 5;0 0" dur="6.9s" begin="-5.6s" repeatCount="indefinite"/>
          <rect x="-134" y="-65" width="64" height="26" rx="13" fill="#0b1015" stroke="#ffffff" stroke-opacity="0.14"/>
          <text x="-102" y="-48" text-anchor="middle" fill="#c7d0dc">AI</text>
        </g>
      </g>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="1199" height="339" rx="26" fill="none" stroke="#ffffff" stroke-opacity="0.09"/>
</svg>
