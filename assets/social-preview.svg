<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="D4Tech Hub — Super-App 21 perangkat kreator, AI dan siber">
  <title>D4Tech Hub — Super-App 21 perangkat kreator, AI &amp; siber</title>
  <defs>
    <linearGradient id="spBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1016"/>
      <stop offset="0.55" stop-color="#080b10"/>
      <stop offset="1" stop-color="#0b0f14"/>
    </linearGradient>

    <linearGradient id="spWord" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#e8fff2"/>
      <stop offset="0.78" stop-color="#a6f4c5"/>
      <stop offset="1" stop-color="#34e08d"/>
    </linearGradient>

    <linearGradient id="spArc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12b76a" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#34e08d" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#a6f4c5" stop-opacity="0.2"/>
    </linearGradient>

    <radialGradient id="spGlowE" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#12b76a" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#12b76a" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="spGlowC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ce3f55" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#ce3f55" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="spCore" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#34e08d" stop-opacity="0.42"/>
      <stop offset="0.7" stop-color="#12b76a" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#12b76a" stop-opacity="0"/>
    </radialGradient>

    <pattern id="spGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>

    <radialGradient id="spFade" cx="0.5" cy="0.42" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <mask id="spGridMask"><rect width="1280" height="640" fill="url(#spFade)"/></mask>

    <filter id="spSoft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#spBg)"/>
  <rect width="1280" height="640" fill="url(#spGrid)" mask="url(#spGridMask)"/>
  <circle cx="110" cy="20" r="290" fill="url(#spGlowE)" filter="url(#spSoft)"/>
  <circle cx="1170" cy="600" r="270" fill="url(#spGlowC)" filter="url(#spSoft)"/>

  <!-- hub emblem -->
  <g transform="translate(640 168)">
    <circle r="170" fill="url(#spCore)"/>
    <circle r="104" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>
    <circle r="76" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-dasharray="2 7"/>
    <circle r="104" fill="none" stroke="url(#spArc)" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="140 520"/>
    <circle r="76" fill="none" stroke="#34e08d" stroke-opacity="0.4" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="40 437"/>
    <circle r="36" fill="#0a0f14" stroke="#12b76a" stroke-opacity="0.75" stroke-width="1.4"/>
    <circle r="36" fill="none" stroke="#34e08d" stroke-opacity="0.35"/>
    <text x="0" y="8" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
          font-size="23" font-weight="800" letter-spacing="-0.5" fill="#f3f5f8">D4</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="0.4" fill="#c7d0dc">
      <rect x="-30" y="-117" width="60" height="24" rx="12" fill="#0b1015" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="0" y="-101" text-anchor="middle">MP3</text>
      <rect x="66" y="-51" width="60" height="24" rx="12" fill="#0b1015" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="96" y="-35" text-anchor="middle">TTS</text>
      <rect x="-126" y="-51" width="60" height="24" rx="12" fill="#0b1015" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="-96" y="-35" text-anchor="middle">PDF</text>
      <rect x="66" y="31" width="60" height="24" rx="12" fill="#0b1015" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="96" y="47" text-anchor="middle">QR</text>
      <rect x="-126" y="31" width="60" height="24" rx="12" fill="#0b1015" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="-96" y="47" text-anchor="middle">8D</text>
      <rect x="-30" y="93" width="60" height="24" rx="12" fill="#0b1015" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="0" y="109" text-anchor="middle">AI</text>
    </g>
  </g>

  <!-- wordmark -->
  <g font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="640" y="404" font-size="82" font-weight="800" letter-spacing="-3" fill="url(#spWord)">D4Tech Hub</text>
    <text x="640" y="452" font-size="22" fill="#aeb8c6">21 perangkat kreator, AI &amp; siber — satu hub tanpa registrasi.</text>
  </g>

  <!-- pills -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="0.7" text-anchor="middle">
    <g>
      <rect x="356" y="492" width="168" height="32" rx="9" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.13"/>
      <text x="440" y="513" fill="#c7d0dc">node.js + express</text>
    </g>
    <g>
      <rect x="536" y="492" width="168" height="32" rx="9" fill="#12b76a" fill-opacity="0.1" stroke="#12b76a" stroke-opacity="0.34"/>
      <text x="620" y="513" fill="#a6f4c5">multi-gpu failover</text>
    </g>
    <g>
      <rect x="716" y="492" width="168" height="32" rx="9" fill="#ce3f55" fill-opacity="0.12" stroke="#ce3f55" stroke-opacity="0.34"/>
      <text x="800" y="513" fill="#ffc2cb">tanpa registrasi</text>
    </g>
  </g>

  <text x="640" y="586" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="13" letter-spacing="0.6" fill="#59636f">github.com/daff4tech/daff4tech</text>

  <rect x="0.5" y="0.5" width="1279" height="639" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
</svg>
